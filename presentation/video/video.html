<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>R U OK? · 30 s pitch</title>
    <!-- Composición del vídeo de 30 s (1920×1080). Todo se anima con la Web Animations API y
         `seek(t)` coloca cada animación en el segundo t: render.mjs captura fotograma a fotograma.
         Abierto en un navegador normal, se reproduce solo (sin voz). -->
    <style>
      @font-face {
        font-family: 'Exo 2';
        font-weight: 400;
        src: url('../../frontend/node_modules/@fontsource/exo-2/files/exo-2-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'Exo 2';
        font-weight: 500;
        src: url('../../frontend/node_modules/@fontsource/exo-2/files/exo-2-latin-500-normal.woff2');
      }
      @font-face {
        font-family: 'Exo 2';
        font-weight: 600;
        src: url('../../frontend/node_modules/@fontsource/exo-2/files/exo-2-latin-600-normal.woff2');
      }
      @font-face {
        font-family: Orbitron;
        font-weight: 600;
        src: url('../../frontend/node_modules/@fontsource/orbitron/files/orbitron-latin-600-normal.woff2');
      }
      @font-face {
        font-family: Orbitron;
        font-weight: 800;
        src: url('../../frontend/node_modules/@fontsource/orbitron/files/orbitron-latin-800-normal.woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 300;
        src: url('../../frontend/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-300-normal.woff2');
      }
      :root {
        --bg: #070d12;
        --text: #e6f2f5;
        --muted: #8aa3ad;
        --primary: #5ed6e8;
        --line: rgba(94, 214, 232, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Exo 2', system-ui, sans-serif;
      }
      .stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .aurora {
        position: absolute;
        width: 1400px;
        height: 1400px;
        border-radius: 50%;
        filter: blur(90px);
        background: radial-gradient(circle, rgba(94, 214, 232, 0.28), transparent 65%);
      }
      .sweep {
        position: absolute;
        top: -20%;
        bottom: -20%;
        width: 30%;
        background: linear-gradient(90deg, transparent, rgba(94, 214, 232, 0.12), transparent);
        transform: skewX(-20deg);
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      /* Logo */
      .logo {
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        align-items: center;
        gap: 56px;
        transform: translate(-50%, -50%);
      }
      .wordmark {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 300;
        font-size: 150px;
        letter-spacing: 0.12em;
        line-height: 1;
        display: flex;
      }
      .wordmark span {
        display: inline-block;
        opacity: 0;
      }
      .wordmark .q {
        color: var(--primary);
      }
      .tagline {
        margin-top: 22px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 30px;
        letter-spacing: 0.5em;
        color: var(--muted);
        opacity: 0;
      }
      /* Capturas */
      .shot {
        position: absolute;
        left: 50%;
        top: 41%;
        width: 1400px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(94, 214, 232, 0.45);
        box-shadow:
          0 40px 120px rgba(0, 0, 0, 0.6),
          0 0 0 6px rgba(94, 214, 232, 0.06);
        overflow: hidden;
        background: #000;
      }
      .shot img {
        display: block;
        width: 100%;
        transform-origin: 50% 40%;
      }
      .shot.half {
        width: 820px;
        top: 44%;
      }
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 40px 260px 64px;
        background: linear-gradient(transparent, rgba(7, 13, 18, 0.92) 45%);
        opacity: 0;
      }
      .kicker {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 26px;
        letter-spacing: 0.32em;
        color: var(--primary);
      }
      .title {
        margin-top: 8px;
        font-family: Orbitron, sans-serif;
        font-weight: 600;
        font-size: 58px;
        letter-spacing: 0.01em;
      }
      .tag {
        position: absolute;
        top: 120px;
        padding: 10px 22px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 24px;
        letter-spacing: 0.3em;
        border: 1px solid rgba(94, 214, 232, 0.6);
        background: rgba(7, 13, 18, 0.85);
        color: var(--primary);
      }
      /* Cierre */
      .end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .end .claim {
        margin-top: 46px;
        font-family: Orbitron, sans-serif;
        font-weight: 600;
        font-size: 50px;
        opacity: 0;
      }
      .end .team {
        margin-top: 46px;
        font-size: 34px;
        color: var(--text);
        opacity: 0;
      }
      .end .org {
        margin-top: 16px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 26px;
        letter-spacing: 0.24em;
        color: var(--muted);
        opacity: 0;
      }
      .end .org b {
        color: var(--primary);
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="aurora" id="aurora-a" style="left: -500px; top: -600px"></div>
      <div class="aurora" id="aurora-b" style="right: -600px; bottom: -700px; opacity: 0.7"></div>
      <div class="grid"></div>
      <div class="sweep" id="sweep"></div>

      <!-- Escena 0: logo -->
      <div class="scene" id="intro">
        <div class="logo" id="logo">
          <svg id="emblem" viewBox="0 0 200 200" width="340" height="340"></svg>
          <div>
            <div class="wordmark" id="wm">
              <span>R</span><span>&nbsp;</span><span>U</span><span>&nbsp;</span><span>O</span
              ><span>K</span><span class="q">?</span>
            </div>
            <div class="tagline" id="tagline">MISSION HEALTH</div>
          </div>
        </div>
      </div>

      <div id="scenes"></div>

      <!-- Cierre -->
      <div class="scene" id="end">
        <div class="end">
          <div class="logo" style="position: static; transform: none; gap: 36px">
            <svg id="emblem2" viewBox="0 0 200 200" width="200" height="200"></svg>
            <div class="wordmark" style="font-size: 104px">
              <span style="opacity: 1">R&nbsp;U&nbsp;OK</span><span class="q" style="opacity: 1">?</span>
            </div>
          </div>
          <div class="claim" id="claim">Caring for those who explore.</div>
          <div class="team" id="team">
            Félix Rodríguez González · Alberto Sanz Alonso · Bryan Fajardo · and team
          </div>
          <div class="org" id="org">
            STUDENTS FROM <b>42 BARCELONA</b> · NASA SPACE APPS CHALLENGE 2026
          </div>
        </div>
      </div>
    </div>

    <script>
      const SVGNS = 'http://www.w3.org/2000/svg'
      const R = 74
      const C = 2 * Math.PI * R
      const SEG = 57
      const anims = []
      const A = (el, frames, delay, duration, easing = 'cubic-bezier(.2,.7,.2,1)', extra = {}) => {
        const a = el.animate(frames, { delay: delay * 1000, duration: duration * 1000, fill: 'both', easing, ...extra })
        a.pause()
        anims.push(a)
        return a
      }

      /** El emblema de la app: punteado, 7 segmentos, acento que recorre el anillo y cuadrado. */
      function emblem(svg, t0, speed = 1) {
        const dots = document.createElementNS(SVGNS, 'circle')
        Object.entries({ cx: 100, cy: 100, r: 95, fill: 'none', stroke: '#e6f2f5', 'stroke-opacity': 0.4, 'stroke-width': 4, 'stroke-dasharray': '1 5.25' }).forEach(([k, v]) => dots.setAttribute(k, v))
        svg.appendChild(dots)
        dots.style.transformOrigin = '100px 100px'
        A(dots, [{ transform: 'rotate(0deg)', opacity: 0 }, { opacity: 1, offset: 0.08 }, { transform: 'rotate(120deg)', opacity: 1 }], t0, 30, 'linear')
        const g = document.createElementNS(SVGNS, 'g')
        g.setAttribute('transform', 'rotate(-85.4 100 100)')
        g.setAttribute('fill', 'none')
        g.setAttribute('stroke-width', 16)
        svg.appendChild(g)
        for (let i = 0; i < 7; i++) {
          const c = document.createElementNS(SVGNS, 'circle')
          Object.entries({ cx: 100, cy: 100, r: R, stroke: '#e6f2f5' }).forEach(([k, v]) => c.setAttribute(k, v))
          c.setAttribute('stroke-dasharray', `0 ${C}`)
          c.setAttribute('stroke-dashoffset', -(i * C) / 7)
          g.appendChild(c)
          A(c, [{ strokeDasharray: `0 ${C}` }, { strokeDasharray: `${SEG} ${C - SEG}` }], t0 + 0.15 + i * 0.09 * speed, 0.45 * speed)
        }
        const acc = document.createElementNS(SVGNS, 'circle')
        Object.entries({ cx: 100, cy: 100, r: R, stroke: '#5ed6e8', 'stroke-dasharray': `${SEG} ${C - SEG}` }).forEach(([k, v]) => acc.setAttribute(k, v))
        g.appendChild(acc)
        // El acento salta de segmento en segmento (uno por sistema del cuerpo).
        const hops = []
        for (let i = 0; i <= 14; i++) hops.push({ strokeDashoffset: -((i % 7) * C) / 7, offset: i / 14, easing: 'steps(1, end)' })
        A(acc, [{ opacity: 0 }, { opacity: 1 }], t0 + 0.9 * speed, 0.3)
        A(acc, hops, t0 + 0.9 * speed, 6, 'linear', { iterations: 5, composite: 'add' })
        const sq = document.createElementNS(SVGNS, 'rect')
        Object.entries({ x: 91, y: 91, width: 18, height: 18, fill: '#e6f2f5' }).forEach(([k, v]) => sq.setAttribute(k, v))
        sq.style.transformOrigin = '100px 100px'
        svg.appendChild(sq)
        A(sq, [{ transform: 'scale(0)' }, { transform: 'scale(1.4)', offset: 0.7 }, { transform: 'scale(1)' }], t0 + 0.75 * speed, 0.45)
      }

      // Fondo vivo
      A(document.getElementById('aurora-a'), [{ transform: 'translate(0,0)' }, { transform: 'translate(260px, 180px) scale(1.15)' }], 0, 30, 'ease-in-out')
      A(document.getElementById('aurora-b'), [{ transform: 'translate(0,0)' }, { transform: 'translate(-240px, -160px) scale(0.9)' }], 0, 30, 'ease-in-out')
      const sweep = document.getElementById('sweep')
      A(sweep, [{ transform: 'translateX(-40vw) skewX(-20deg)' }, { transform: 'translateX(140vw) skewX(-20deg)' }], 0.2, 4, 'cubic-bezier(.45,0,.2,1)', { iterations: 7, endDelay: 0 })

      // Escena 0 (0–3,4 s): logo
      const intro = document.getElementById('intro')
      A(intro, [{ opacity: 0 }, { opacity: 1 }], 0, 0.2)
      emblem(document.getElementById('emblem'), 0.1)
      document.querySelectorAll('#wm span').forEach((s, i) =>
        A(s, [{ opacity: 0, transform: 'translateY(40px)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], 0.9 + i * 0.1, 0.45),
      )
      A(document.querySelector('#wm .q'), [{ opacity: 1 }, { opacity: 0.25 }, { opacity: 1 }], 2.0, 0.6, 'linear', { iterations: 2 })
      A(document.getElementById('tagline'), [{ opacity: 0, letterSpacing: '0.9em' }, { opacity: 1, letterSpacing: '0.5em' }], 1.7, 0.7)
      A(document.getElementById('logo'), [{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(1.06)' }], 0, 3.4, 'linear')
      A(intro, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(12px)' }], 3.05, 0.4)

      // Escenas con capturas
      const SCENES = [
        { img: '01-dashboard', t0: 3.35, t1: 7.6, kicker: 'MARS BASE · 14 MIN FROM EARTH', title: 'Crew health at a glance', zoom: [1, 1.06], origin: '60% 45%' },
        { img: '02-trends', t0: 7.6, t1: 9.45, kicker: 'YOUR OWN BASELINE', title: 'Personal ranges', zoom: [1.12, 1.22], origin: '50% 55%' },
        { img: '03-measure', t0: 9.45, t1: 11.3, kicker: 'GUIDED CHECKS', title: 'Measure in seconds', zoom: [1.1, 1.2], origin: '45% 45%' },
        { img: '04-alerts', t0: 11.3, t1: 13.35, kicker: 'EARLY WARNING', title: 'Smart alerts', zoom: [1.05, 1.15], origin: '55% 35%' },
        { img: '05-meditation', t0: 13.35, t1: 15.3, kicker: 'STRESS MANAGEMENT', title: 'Guided meditation', zoom: [1, 1.08], origin: '50% 50%' },
        { img: '06-missions', t0: 15.3, t1: 17.1, kicker: 'LIVING TOGETHER', title: 'Crew missions & kudos', zoom: [1.04, 1.12], origin: '45% 55%' },
        { img: '07-home', t0: 17.1, t1: 19.05, kicker: 'STAY CONNECTED', title: 'Messages home', zoom: [1.04, 1.12], origin: '55% 50%' },
        { img: '09-control', t0: 19.05, t1: 21.35, kicker: 'NASA MISSIONS · WORKS OFFLINE', title: 'Mission control', zoom: [1.02, 1.1], origin: '50% 40%' },
      ]
      const host = document.getElementById('scenes')
      for (const s of SCENES) {
        const el = document.createElement('div')
        el.className = 'scene'
        el.innerHTML = `<div class="shot"><img src="shots/${s.img}.png"></div><div class="caption"><div class="kicker">${s.kicker}</div><div class="title">${s.title}</div></div>`
        host.appendChild(el)
        const d = s.t1 - s.t0
        A(el, [{ opacity: 0 }, { opacity: 1, offset: 0.12 / d }, { opacity: 1, offset: 1 - 0.18 / d }, { opacity: 0 }], s.t0, d, 'linear')
        const shot = el.querySelector('.shot')
        A(shot, [{ transform: 'translate(-50%,-46%) scale(0.96)' }, { transform: 'translate(-50%,-50%) scale(1)', offset: 0.25 }, { transform: 'translate(-50%,-50.5%) scale(1.01)' }], s.t0, d)
        const img = el.querySelector('img')
        img.style.transformOrigin = s.origin
        A(img, [{ transform: `scale(${s.zoom[0]})` }, { transform: `scale(${s.zoom[1]})` }], s.t0, d, 'cubic-bezier(.3,.1,.3,1)')
        const cap = el.querySelector('.caption')
        A(cap, [{ opacity: 0, transform: 'translateX(-30px)' }, { opacity: 1, transform: 'none' }], s.t0 + 0.15, 0.4)
      }

      // En la Tierra: residencia y hospital, lado a lado (21,35–24 s)
      {
        const el = document.createElement('div')
        el.className = 'scene'
        el.innerHTML = `
          <div class="shot half" id="h1" style="left:27%"><img src="shots/10-geriatric.png"></div>
          <div class="shot half" id="h2" style="left:73%"><img src="shots/11-hospital.png"></div>
          <div class="tag" style="left:calc(27% - 410px)">CARE HOMES</div>
          <div class="tag" style="left:calc(73% - 410px)">HOSPITALS</div>
          <div class="caption"><div class="kicker">THE SAME CARE, ON EARTH</div><div class="title">Hospitals & care homes</div></div>`
        host.appendChild(el)
        const t0 = 21.35
        const d = 2.75
        A(el, [{ opacity: 0 }, { opacity: 1, offset: 0.05 }, { opacity: 1, offset: 0.92 }, { opacity: 0 }], t0, d, 'linear')
        A(el.querySelector('#h1'), [{ transform: 'translate(-50%,-50%) translateY(60px)', opacity: 0 }, { transform: 'translate(-50%,-50%)', opacity: 1 }], t0, 0.5)
        A(el.querySelector('#h2'), [{ transform: 'translate(-50%,-50%) translateY(60px)', opacity: 0 }, { transform: 'translate(-50%,-50%)', opacity: 1 }], t0 + 0.25, 0.5)
        el.querySelectorAll('.tag').forEach((tg, i) => A(tg, [{ opacity: 0 }, { opacity: 1 }], t0 + 0.4 + i * 0.25, 0.35))
        A(el.querySelector('.caption'), [{ opacity: 0, transform: 'translateX(-30px)' }, { opacity: 1, transform: 'none' }], t0 + 0.2, 0.4)
      }

      // Cierre (24–30 s)
      const end = document.getElementById('end')
      A(end, [{ opacity: 0 }, { opacity: 1 }], 24.0, 0.5, 'linear')
      emblem(document.getElementById('emblem2'), 24.0, 0.8)
      A(document.getElementById('claim'), [{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }], 25.6, 0.6)
      A(document.getElementById('team'), [{ opacity: 0 }, { opacity: 1 }], 26.6, 0.6)
      A(document.getElementById('org'), [{ opacity: 0 }, { opacity: 1 }], 27.2, 0.6)
      A(document.getElementById('stage'), [{ opacity: 1 }, { opacity: 1, offset: 0.7 }, { opacity: 0 }], 29.4, 0.6, 'linear')

      window.DURATION = 30
      window.seek = (t) => {
        for (const a of anims) a.currentTime = t * 1000
      }
      window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))])
      // En un navegador normal, se reproduce solo.
      if (!navigator.webdriver && !location.search.includes('render')) {
        const start = performance.now()
        const tick = () => {
          const t = (performance.now() - start) / 1000
          window.seek(t % 30)
          requestAnimationFrame(tick)
        }
        window.ready.then(() => requestAnimationFrame(tick))
      } else {
        window.seek(0)
      }
    </script>
  </body>
</html>
