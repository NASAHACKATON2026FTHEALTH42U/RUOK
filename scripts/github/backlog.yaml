# Backlog RUOK: fuente de verdad para create_issues.py
# Orden = orden de creación = prioridad por dependencias (las bloqueantes primero).
# area: backend | frontend | fullstack | content
# priority: P0-blocker | P1 | P2
# milestone: m0 | h1 | h2 | freeze | roadmap
# comp: clave de `components` (qué parte del sistema resuelve la issue)

milestones:
  m0: { title: "M0 Setup (sáb +2h)", description: "Scaffolding, contrato v0, catálogos. Desbloquea a todo el equipo." }
  h1: { title: "Hito 1 (sáb noche)", description: "Dashboard con cuerpo + semáforo con datos reales y cambio de entorno." }
  h2: { title: "Hito 2 (dom 09:00)", description: "MVP integrado: alertas, offline, liveness, gamificación, consola ground." }
  freeze: { title: "Freeze (dom 11:00)", description: "P2 y pulido. Lo no terminado a las 11:00 se corta." }
  roadmap: { title: "Roadmap (después de la demo)", description: "Diseño cerrado, sin implementar antes de la presentación." }

labels:
  "area:backend":     { color: "0052cc", description: "FastAPI / Python" }
  "area:frontend":    { color: "0e8a16", description: "React / TS" }
  "area:fullstack":   { color: "6f42c1", description: "Integración front-back, tooling" }
  "area:content":     { color: "fbca04", description: "Contenido HRP, textos, pitch (supervisor)" }
  "P0-blocker":       { color: "b60205", description: "Genera dependencias: hacer primero" }
  "P1":               { color: "d93f0b", description: "MVP" }
  "P2":               { color: "bfbfbf", description: "Si da tiempo; se corta en el freeze" }

components:
  # key: { short: prefijo del título, emoji, name: nombre largo, color: label hex, project: color del Kanban }
  setup:      { short: "Setup",       emoji: "⚙️",  name: "Setup / Infra (scaffolding, CI, docker)",          color: "6e7781", project: GRAY }
  contract:   { short: "Contrato",    emoji: "📜", name: "Contrato API (schemas, tipos TS, mocks)",           color: "8250df", project: PURPLE }
  db:         { short: "BD",          emoji: "🗄️",  name: "Base de datos (modelos SQLModel, tablas, seed)",   color: "0969da", project: BLUE }
  config:     { short: "Config",      emoji: "📚", name: "Catálogos y configuración JSON (entornos, indicadores, textos)", color: "bf8700", project: YELLOW }
  api:        { short: "API",         emoji: "🌐", name: "Endpoints REST",                                    color: "54aeff", project: BLUE }
  engine:     { short: "Motor",       emoji: "🧠", name: "Motor de evaluación (umbrales, tendencias)",        color: "cf222e", project: RED }
  alerts:     { short: "Alertas",     emoji: "🚨", name: "Alertas y escalado (SOS, consola ground)",          color: "fa4549", project: RED }
  link:       { short: "Enlace",      emoji: "📡", name: "Enlace simulado con Tierra (retardo, LOS)",         color: "1f6feb", project: BLUE }
  liveness:   { short: "Liveness",    emoji: "💓", name: "Liveness (heartbeat, R U OK?)",                     color: "e85aad", project: PINK }
  offline:    { short: "Offline",     emoji: "📴", name: "Offline y sincronización (IndexedDB, outbox)",      color: "57606a", project: GRAY }
  ui:         { short: "UI",          emoji: "🎨", name: "UI base, temas y pulido",                           color: "2da44e", project: GREEN }
  dashboard:  { short: "Dashboard",   emoji: "🫀", name: "Dashboard, cuerpo SVG y gráficas",                  color: "1a7f37", project: GREEN }
  forms:      { short: "Formularios", emoji: "📝", name: "Formularios de medición",                           color: "4ac26b", project: GREEN }
  game:       { short: "Juego",       emoji: "🎮", name: "Rutina y gamificación",                             color: "fb8f44", project: ORANGE }
  behavioral: { short: "Conductual",  emoji: "🧘", name: "Salud conductual / aislamiento",                    color: "a475f9", project: PURPLE }
  realtime:   { short: "Tiempo real", emoji: "📶", name: "Tiempo real y dispositivos (SSE, event_log, device)", color: "0e8a16", project: GREEN }
  control:    { short: "Control",     emoji: "🛰️", name: "Centro de control (vista global y gestión)",        color: "5319e7", project: PURPLE }
  auth:       { short: "Auth",        emoji: "🔐", name: "Login y roles (acceso por vistas)",                 color: "b60205", project: RED }
  pitch:      { short: "Pitch",       emoji: "🎤", name: "Pitch, demo y envío",                               color: "d4a72c", project: YELLOW }

