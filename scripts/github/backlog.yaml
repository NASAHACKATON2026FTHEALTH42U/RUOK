- id: FS-09
  title: Previsión de valores esperados por indicador (modelo Holt amortiguado, 100 % local)
  area: fullstack
  comp: engine
  priority: P2
  milestone: freeze
  depends: [BE-10, BE-06, FE-09]
  docs: api-contract.md
  tasks:
    - "Contrato: `GET /members/{id}/forecast?indicator_id=&horizon_days=` con el schema `Forecast` (puntos diarios con banda del 80 %, primer cambio de estado previsto y error de backtest)"
    - "`services/forecast.py`: suavizado exponencial de Holt con tendencia amortiguada, ajustado por member e indicador con sus propias mediciones; funciones puras, sin dependencias nuevas y con `clock.now()`"
    - "Los rangos son los del motor (`merge_ranges` + `classify`): catálogo + `threshold_overrides` del entorno; ningún umbral clínico en el código"
    - "Sin datos suficientes (< 7 días con mediciones) o con el último dato caducado (`max_age_s`) no se prevé nada: sin datos = desconocido"
    - "Privacidad conductual: la previsión de un indicador privado solo la ve quien puede ver sus detalles"
    - "Front: línea discontinua y banda en la gráfica del Historial, resumen en texto («a este ritmo podría entrar en Atención en ~N días») y aviso de que es una estimación, no un diagnóstico"
    - "Mocks (`gen:mocks` + handler) para el modo demo sin servidor; método citado en `docs/sources.md`"
  acceptance:
    - "Tests con series sintéticas: constante, lineal, ruido, pocos datos, datos caducados, serie semanal y acumulada"
    - "Tras el escenario `mars_sleep_bp`, el Historial de la tensión de Vega muestra la previsión y el cambio de estado previsto"
    - "La previsión es informativa: no crea alertas ni cambia el `assessment`"
    - "Un rol sin permiso para ver lo conductual recibe 403 al pedir la previsión de un indicador privado"

- id: FS-10
  title: Asistente local sobre un member y su previsión (LLM pequeño a bordo, 100 % local)
  area: fullstack
  comp: engine
  priority: P2
  milestone: roadmap
  depends: [FS-09, BE-27]
  docs: assistant.md
  tasks:
    - "Contrato: `POST /members/{id}/assistant` (`AssistantQuestion`, `AssistantAnswer` con `kind` model | summary | out_of_scope) y permiso `assistant:ask` (`allow_member`); no crea datos, sin UUID ni evento"
    - "`services/assistant.py`: `collect` + `render_sheet` (función pura) con la ficha del member filtrada para quien pregunta; privacidad conductual, alertas solo con campos estructurados y «sin datos vigentes» para lo caducado; textos en `data/assistant.json`"
    - "Capa 1: resumen automático por palabras clave, sin modelo"
    - "Capa 2: `services/llm.py` (cliente Ollama con `urllib`, solo loopback o red privada, sin proxy, una generación a la vez, timeout y pausa tras error); el modelo devuelve `{tipo, temas}` de lista cerrada y el código escribe la respuesta; frases fijas de rechazo"
    - "Front: página `/assistant` (selector de member para el personal, `mentionedMember`, chips, «Cancelar», etiqueta del origen de la respuesta, aviso fijo) y mock con el resumen automático"
    - "`scripts/assistant_eval.py` (~130 preguntas en es/ca/en) para elegir el modelo; servicio opcional `ollama` con perfil `ai` en docker-compose; docs y fuentes (licencia del modelo)"
  acceptance:
    - "Sin modelo, con el modelo parado o con una respuesta inválida, la API devuelve `kind: summary`, nunca un error"
    - "Como commander o medic sin permiso, el cuerpo enviado al modelo no contiene datos conductuales privados ni el texto de ninguna alerta"
    - "member sobre otro member, responder, psych y family reciben 403; no se guarda nada"
    - "Evaluación: rechaza ≥ 95 % de lo fuera de tema, acepta ≥ 90 % de lo que es del tema, elige los temas correctos ≥ 85 %; latencia mediana ≤ 8 s y p95 ≤ 15 s"
    - "La CI pasa en verde sin servidor de modelos"
