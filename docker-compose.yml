# R U OK? en un comando (BE-24):  docker compose up --build
# FastAPI sirve la API (/api/v1) y el build del front en el puerto 8000, escuchando en 0.0.0.0
# para los móviles de la red local (http://<ip-del-servidor>:8000). Ollama (LLM local) va al lado
# para las respuestas de «Mensaje a casa»; sin él, la app sigue con las frases guionizadas.
services:
  ruok:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "true"
      # IP del portátil en la red local para el QR (BE-30). Dentro del contenedor solo se ve
      # su IP interna: RUOK_LAN_HOST=192.168.8.10 docker compose up
      RUOK_LAN_HOST: ${RUOK_LAN_HOST:-}
      # LLM local para las respuestas de «Mensaje a casa» (personaje del entorno). Si no
      # responde a tiempo, se usan las frases guionizadas: la app nunca depende de él.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-25}
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ruok-data:/data   # la BD SQLite sobrevive a los reinicios
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 3s
      retries: 3

  # LLM local (Ollama). El modelo se descarga UNA vez (servicio ollama-pull) y queda en el volumen:
  # después todo funciona sin internet. Para cambiar de modelo: OLLAMA_MODEL=llama3.2:3b
  ollama:
    image: ollama/ollama:0.9.0
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Para usar la GPU de NVIDIA, descomenta (requiere nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Descarga el modelo si aún no está y termina (con internet solo la primera vez).
  ollama-pull:
    image: ollama/ollama:0.9.0
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  ruok-data:
  ollama-models:
