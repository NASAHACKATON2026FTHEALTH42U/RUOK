name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cada job comprueba si su parte existe ya (el scaffolding llega en FS-01/BE-01/FE-01).
# Mientras no exista, el job pasa en verde con un aviso, para no bloquear las PRs de docs.

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - id: exists
        working-directory: .
        run: |
          if [ -f backend/pyproject.toml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::backend/ aún no existe; se omite"; fi

      - if: steps.exists.outputs.ok == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        if: steps.exists.outputs.ok == 'true'
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        if: steps.exists.outputs.ok == 'true'
        run: uv run --with ruff ruff check .

      - name: Tests
        if: steps.exists.outputs.ok == 'true'
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - id: exists
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend/ aún no existe; se omite"; fi

      - if: steps.exists.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.exists.outputs.ok == 'true'
        run: npm ci

      - name: Lint
        if: steps.exists.outputs.ok == 'true'
        run: npm run lint --if-present

      - name: Build (incluye chequeo de tipos)
        if: steps.exists.outputs.ok == 'true'
        run: npm run build

      - name: Tests
        if: steps.exists.outputs.ok == 'true'
        run: npm test --if-present

  contract:
    name: Contrato API (tipos TS al día)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: exists
        run: |
          if [ -f backend/pyproject.toml ] && [ -f frontend/src/api/types.gen.ts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Aún no hay tipos generados; se omite"; fi

      - if: steps.exists.outputs.ok == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - if: steps.exists.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Exportar OpenAPI desde FastAPI
        if: steps.exists.outputs.ok == 'true'
        working-directory: backend
        run: |
          uv sync
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > ../openapi.json

      - name: Regenerar tipos y comprobar que no hay diferencias
        if: steps.exists.outputs.ok == 'true'
        working-directory: frontend
        run: |
          npx --yes openapi-typescript ../openapi.json -o src/api/types.gen.ts
          git diff --exit-code src/api/types.gen.ts || {
            echo "::error::types.gen.ts no está al día con el backend. Ejecuta 'npm run gen:api' y commitea."; exit 1; }
